<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MuSuBi Music Center</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Pretendard', sans-serif; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: #181818; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #1DB954; text-align: center; border-bottom: 2px solid #282828; padding-bottom: 20px; }
        .music-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-radius: 8px; transition: 0.3s; margin-top: 5px; }
        .music-card:hover { background: #282828; cursor: pointer; }
        .title { font-weight: bold; font-size: 1.1em; }
        .artist { color: #b3b3b3; font-size: 0.9em; }
        .play-icon { color: #1DB954; font-size: 1.5em; }
        input { background: #333; border: 1px solid #444; color: white; border-radius: 5px; margin-bottom: 10px; padding: 8px; width: 95%; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎧 MuSuBi 실시간 차트</h1>

    <form action="/add" method="post" style="background: #282828; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <h3 style="margin-top:0; color: #1DB954;">새 노래 공유하기</h3>
        <input type="text" name="title" placeholder="노래 제목" required>
        <input type="text" name="artist" placeholder="아티스트" required>
        <input type="text" name="youtubeId" placeholder="유튜브 ID (예: pFEBCS3L83Y)" required>
        <button type="submit" style="background: #1DB954; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">차트에 올리기</button>
    </form>

    <div id="player" style="margin-bottom: 20px; display: none;">
        <iframe id="youtube-frame" width="100%" height="250" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <div th:each="song : ${songs}" class="music-card" th:data-id="${song.youtubeId}" onclick="playMusic(this.getAttribute('data-id'))">
        <div>
            <div class="title" th:text="${song.title}">곡 제목</div>
            <div class="artist">
                <span th:text="${song.artist}">아티스트</span> |
                <small>공유자: </small><span th:text="${song.sharedBy}" style="color: #1DB954;">공유자</span>
            </div>
        </div>
        <div class="play-icon">▶</div>
    </div>
</div>

<script>
    function playMusic(id) {
        if(!id) return;
        const frame = document.getElementById('youtube-frame');
        const playerDiv = document.getElementById('player');
        frame.src = "https://www.youtube.com/embed/" + id;
        playerDiv.style.display = 'block';
        window.scrollTo(0, 0);
    }
</script>
</body>
</html>
